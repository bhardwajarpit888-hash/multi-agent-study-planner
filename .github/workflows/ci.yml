name: Multi-Agent Study Planner CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Integration Tests
      run: |
        python tests/test_planner.py

    - name: Run LLM Evaluation Benchmark
      run: |
        python -c "from src.evaluation.evaluator import run_full_evaluation_suite; res = run_full_evaluation_suite(); print('Composite Evaluation Score:', res['composite_quality_score']); assert res['composite_quality_score'] >= 85.0"
